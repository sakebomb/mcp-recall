[profile]
id          = "mcp__context7"
version     = "2.0.0"
description = "Context7 query-docs — keeps the top of the returned documentation"
mcp_pattern = "mcp__context7__query-docs"
short_name  = "context7"
author      = "sakebomb"
mcp_url     = "https://github.com/upstash/context7"
sample_tool = "mcp__context7__query-docs"

# Context7 returns markdown documentation in a text block, not JSON; the old
# json_extract settings found no fields and delivered an empty summary. The docs
# are the answer Claude asked for, ranked best-first, so keep the top of them;
# the rest stays retrievable via recall__retrieve.
[strategy]
type      = "text_truncate"
max_chars = 2000
