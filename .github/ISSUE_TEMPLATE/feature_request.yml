name: Feature request
description: Suggest an idea or improvement
title: "[Feature]: "
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. **Please do not paste secrets, tokens, or personal data** into this issue.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What problem are you trying to solve or what is hard to do today?
    validations:
      required: true
  - type: textarea
    id: affected
    attributes:
      label: Who is affected
      description: Who runs into this problem (for example users, admins, contributors, visitors)?
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe what you would like to happen.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you have considered.
  - type: textarea
    id: handler
    attributes:
      label: "Target MCP tool(s) and compressed output (for new handlers)"
      description: "For new handlers: which MCP tool(s) does it target, and what does the compressed output look like? For compression profiles for a specific MCP, use the Profile request template instead."
