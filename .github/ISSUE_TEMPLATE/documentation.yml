name: Documentation
description: Report missing, unclear, or incorrect documentation
title: "[Docs]: "
labels: ["docs"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the docs. **Please do not paste secrets, tokens, or personal data** into this issue.
  - type: input
    id: location
    attributes:
      label: Page or file
      description: Which page, URL, or file is affected?
      placeholder: "e.g. README.md or https://example.com/docs/setup"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing
      description: Describe what is incorrect, unclear, or missing.
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: Suggested fix
      description: If you have a suggestion for the wording or content, add it here.
