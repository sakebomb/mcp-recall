name: Claude Code

# Auto-reviews every PR and responds to @claude mentions in issue/PR comments.
# Auth: Claude subscription OAuth token — reviews bill against the personal Max
# subscription instead of metered API/Console usage. This trades the former
# keyless WIF setup (rule repo:sakebomb/*) for a long-lived secret to rotate.
#
# SETUP (one-time): `claude setup-token` on the Max account prints an sk-ant-oat
# token; store it as this repo's CLAUDE_CODE_OAUTH_TOKEN secret via `gh secret set`.
#
# CAVEATS: ~1-year token, expires SILENTLY (regenerate with `claude setup-token`);
# CI shares one rate-limit pool with interactive Claude Code and every other repo
# on this token; tied to the individual who ran setup-token.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    # Skip comment events that don't tag @claude so we don't burn runner minutes
    # on every comment; PR events always run (auto-review).
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read     # lets the github_ci MCP server read CI/check status during reviews
      id-token: write   # the action fetches a GitHub OIDC token to mint its GitHub App token for posting
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          # Subscription OAuth token (see header). Bills against the personal Max
          # plan, not the API/Console workspace. Set via `gh secret set CLAUDE_CODE_OAUTH_TOKEN`.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Auto PR review supplies a review prompt; mentions use the comment body.
          #
          # The CI-verification clause is deliberate. Reviews were inconsistently
          # disclaiming "could not reproduce the test count" even though this job
          # holds `actions: read` for exactly that — some reviews read the CI run and
          # settled claims from it, others assumed they could not. Nothing in the old
          # prompt asked them to look. See #221; this needs no extra permission.
          #
          # Folded scalar (>-) so the prompt stays readable; YAML folds the newlines
          # to spaces before Actions evaluates the expression. Avoid apostrophes in
          # the text — it lives inside a single-quoted GitHub expression string.
          prompt: >-
            ${{ github.event_name == 'pull_request' && 'Review this PR for
            correctness, security, and adherence to the repo conventions in
            CLAUDE.md. Flag CRITICAL/HIGH issues clearly and keep notes concise.
            Treat every factual claim in the PR body as unverified until you have
            checked it against the code. For claims about test counts, coverage, or
            CI status, read the CI run for the head commit and settle them from it
            rather than disclaiming that you could not verify them. Say plainly
            which claims you verified and how, and which you could not — never
            present reasoning as verification.' || '' }}
          trigger_phrase: "@claude"
          track_progress: "true"

          # Cost control: pin claude-action to Sonnet-5 (~5x cheaper than Opus 4.8, strong at review + most coding).
          claude_args: "--model claude-sonnet-5"
