name: Publish to npm

on:
  release:
    types: [published]
  # Dry run of the binaries job (#377): builds and smoke-tests every target and
  # keeps them as a workflow artifact. Publishes nothing — the npm job is skipped
  # and no release is touched.
  workflow_dispatch:

jobs:
  publish:
    name: Publish
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2.1.3
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Fails closed before anything is published. The release tag is created by
      # hand, so a tag pointed at a commit whose package.json says something else
      # would otherwise publish a silently mislabeled version.
      # Tag arrives via env, not `${{ }}` inside run: — expressions are substituted
      # textually before bash parses the line, and git permits $ ` ; " | ( ) in ref
      # names. This job holds id-token: write with job-wide OIDC vars, so injected
      # code here could mint a provenance-signing token.
      - name: Verify release tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::release tag $TAG does not match package.json ($PKG)"
            exit 1
          fi
          echo "release tag $TAG matches package.json"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Tests
        run: bun test

      - name: Build
        run: bun run build

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Standalone binaries attached to the release (#361). A separate job so the
  # npm job keeps contents: read and this one never sees NPM_TOKEN or an OIDC
  # token; it runs only after npm publish succeeded, so a failed release gets no
  # binaries. On a dry run publish is skipped, which would skip this job too
  # without the explicit condition.
  binaries:
    name: Standalone binaries
    needs: publish
    if: ${{ !cancelled() && (needs.publish.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2.1.3
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      # Same guard as the publish job, and the tag arrives via env for the same reason.
      - name: Verify release tag matches package.json
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::release tag $TAG does not match package.json ($PKG)"
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # A dry run builds unreleased main, so it must not carry a released version
      # number (#379). The suffix reaches --version and the profile-extraction dir.
      - name: Stamp a dry-run version
        if: github.event_name == 'workflow_dispatch'
        run: |
          VERSION="$(node -p "require('./package.json').version")-dryrun.${GITHUB_SHA::7}"
          npm pkg set version="$VERSION"
          echo "dry-run build version $VERSION"

      - name: Build every release target
        run: bun run build:binary --all

      - name: Exercise the linux-x64 binary before attaching anything
        run: bash scripts/packaged-cli-smoke.sh --binary dist/bin/mcp-recall-linux-x64

      - name: Keep binaries and checksums as a workflow artifact (dry run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: standalone-binaries
          path: |
            dist/bin/mcp-recall-*
            dist/bin/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

      - name: Attach binaries and checksums to the release
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/bin/mcp-recall-* dist/bin/SHA256SUMS --clobber
